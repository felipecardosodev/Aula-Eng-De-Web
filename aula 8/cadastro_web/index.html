<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/global.css">
  <script src="scripts/index.js" defer></script>
  <title>Cadastro de usuário</title>
</head>
<body>
  <header>
    <h1>Cadastro de usuário</h1>
    <p>Preencha os campos abaixo para realizar seu cadastro.</p>
  </header>

  <main>
    <form id="cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome completo *</label>
        <input type="text" id="nome" name="nome" autocomplete="name">
        <small id="erro-nome" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="cpf">CPF *</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
        <small id="erro-cpf" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="nascimento">Data de nascimento *</label>
        <input type="date" id="nascimento" name="nascimento">
        <small id="erro-nascimento" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="idade">Idade *</label>
        <input type="number" id="idade" name="idade" min="18" max="120">
        <small id="erro-idade" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="celular">Celular *</label>
        <input type="tel" id="celular" name="celular" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric">
        <small id="erro-celular" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <small id="erro-email" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="senha">Senha *</label>
        <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password">
        <small id="erro-senha" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar senha *</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" autocomplete="new-password">
        <small id="erro-confirmarSenha" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="cep">CEP *</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" inputmode="numeric">
        <small id="erro-cep" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="cidade">Cidade *</label>
        <input type="text" id="cidade" name="cidade" autocomplete="address-level2">
        <small id="erro-cidade" class="mensagem-erro"></small>
      </div>

      <div class="campo">
        <label for="estado">Estado *</label>
        <select id="estado" name="estado">
          <option value="">Selecione</option>
          <option value="AC">Acre</option><option value="AL">Alagoas</option>
          <option value="AP">Amapá</option><option value="AM">Amazonas</option>
          <option value="BA">Bahia</option><option value="CE">Ceará</option>
          <option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option>
          <option value="GO">Goiás</option><option value="MA">Maranhão</option>
          <option value="MT">Mato Grosso</option><option value="MS">Mato Grosso do Sul</option>
          <option value="MG">Minas Gerais</option><option value="PA">Pará</option>
          <option value="PB">Paraíba</option><option value="PR">Paraná</option>
          <option value="PE">Pernambuco</option><option value="PI">Piauí</option>
          <option value="RJ">Rio de Janeiro</option><option value="RN">Rio Grande do Norte</option>
          <option value="RS">Rio Grande do Sul</option><option value="RO">Rondônia</option>
          <option value="RR">Roraima</option><option value="SC">Santa Catarina</option>
          <option value="SP">São Paulo</option><option value="SE">Sergipe</option>
          <option value="TO">Tocantins</option>
        </select>
        <small id="erro-estado" class="mensagem-erro"></small>
      </div>

      <label class="termos" for="termos">
        <input type="checkbox" id="termos" name="termos">
        Li e aceito os termos de cadastro *
      </label>
      <small id="erro-termos" class="mensagem-erro"></small>

      <button type="submit" id="btn-enviar">Enviar cadastro</button>
      <p id="concluido" role="status"></p>
    </form>
  </main>

  <footer>
    <p>* Campos obrigatórios.</p>
  </footer>
</body>
</html>

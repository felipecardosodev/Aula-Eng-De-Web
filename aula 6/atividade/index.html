<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/atividade.css">
    <title>Grade de Shows</title>
</head>
<body>
    <header>
        <h1>Shows</h1>
    </header>
    <main>
        <section>
            <h2>Grade dos Shows</h2>
            <div class="conteiner-grid">
                <div class="item">Show 1</div>
                <div class="item">10/11 - 21:00</div>
                <div class="item">Coldplay</div>
                <div class="item">Show 2</div>
                <div class="item">23/11 - 23:30</div>
                <div class="item">Linkin Park</div>
                <div class="item">Show 3</div>
                <div class="item">04/12 - 20:00</div>
                <div class="item">Bruno Mars</div>
            </div>
            <p>Os eventos são organizados em uma grade</p>
        </section>

        <section>
        <h2>Ingressos</h2>
            <div class="conteiner-flex">
                <div class="item">Meia Entrada</div>
                <div id="item-2" class="item">Inteira</div>
                <div id="item-3" class="item">VIP</div>
                <div id="item-4" class="item">Pacote Premium</div>
            </div>
            <p>Flexíveis de acordo com o valor dos ingressos.</p>
        </section>
    </main>
    <footer>
        <p>Atividade - Aula 6 - Displays do CSS</p>
    </footer>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/atividade.css">
    <title>Grade de Shows</title>
</head>
<body>
    <header>
        <h1>Shows</h1>
    </header>
    <main>
        <section>
            <h2>Display Grid</h2>
            <div class="conteiner-grid">
                <div class="item">Item 1</div>
                <div class="item">Item 2</div>
                <div class="item">Item 3</div>
                <div class="item">Item 4</div>
                <div class="item">Item 5</div>
                <div class="item">Item 6</div>
                <div class="item">Item 7</div>
                <div class="item">Item 8</div>
                <div class="item">Item 9</div>
            </div>
            <p>Elementos ficam posicionados em linhas e colunas</p>
        </section>

        <section>
        <h2>Display flex</h2>
            <div class="conteiner-flex">
                <div class="item">Item 1</div>
                <div id="item-2" class="item">Item 2</div>
                <div id="item-3" class="item">Item 3</div>
                <div id="item-4" class="item">Item 4</div>
            </div>
            <p>Elementos ficam flexiveis e se organizam em uma direção</p>
        </section>
    </main>
    <footer>
        <p>Atividade - Aula 6 - Displays do CSS</p>
    </footer>
    
</body>
</html>
